<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memórias Escolares</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <h1>Memórias.</h1>
    <nav>
      <button class="nav-btn" data-go="inicio">Início</button>
      <button class="nav-btn" data-go="redacoes">Redações</button>
      <button class="nav-btn" data-go="infancia">Infância</button>
      <button class="nav-btn" data-go="escola">Vida escolar</button>
    </nav>
  </header>

  <main>
    <section id="inicio" class="pagina ativa">
      <h2>Entre lembranças e palavras</h2>
      <p>Um espaço para guardar momentos, histórias e redações que marcaram minha trajetória escolar.</p>
      <button data-go="redacoes">Conhecer minhas redações</button>
    </section>

    <section id="redacoes" class="pagina">
      <h2>Minhas redações</h2>
      <input id="pesquisa-redacoes" type="search" placeholder="Pesquisar redação...">
      <div id="lista-redacoes" class="grade"></div>
      <div id="detalhe-redacao" hidden>
        <button id="voltar-redacoes">← Voltar</button>
        <h3 id="titulo-redacao"></h3>
        <p id="tema-redacao"></p>
        <div id="texto-redacao"></div>
      </div>
    </section>

    <section id="infancia" class="pagina">
      <h2>Memórias de infância</h2>
      <div id="galeria-infancia" class="grade"></div>
    </section>

    <section id="escola" class="pagina">
      <h2>Minha vida escolar</h2>
      <div id="galeria-escola" class="grade"></div>
    </section>
  </main>

  <footer>
    <p>Memórias que o tempo não apaga.</p>
  </footer>

  <script src="redacoes.js"></script>
  <script src="script.js"></script>
</body>
</html>
